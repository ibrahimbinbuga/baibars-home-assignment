# Local demo setup. All credentials in this file are DEMO-ONLY and must never be used in a real deployment.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet_demo_password   # demo-only
    ports:
      # Host port 5433 (not 5432) so it does not clash with a locally installed Postgres.
      # Lets `dotnet run` (appsettings.Development.json) use this database too.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/Fleet.Api/Dockerfile
    environment:
      # Production on purpose: no developer exception page. Demo features are turned on with explicit flags.
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Fleet: "Host=db;Port=5432;Database=fleet;Username=fleet;Password=fleet_demo_password"   # demo-only
      Jwt__SigningKey: "DEMO-ONLY-compose-signing-key-replace-in-any-real-deployment"   # demo-only
      Swagger__Enabled: "true"
      Seed__Enabled: "true"
      Seed__DevicesFile: /config/devices.json
    volumes:
      # Same file the simulator reads: the seeder stores the SHA-256 of each demo device key.
      - ./config/devices.json:/config/devices.json:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  # Named volume: data survives `docker compose down` (only `down -v` deletes it).
  pgdata:

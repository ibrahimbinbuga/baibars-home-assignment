<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fleet Monitor · Vehicles list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#111827;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#1E293B}a:hover{color:#0F172A}
.tn{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{width:48px;height:48px;border:0;background:transparent;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#111827;padding:0;cursor:pointer;font:inherit}
.badge{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 8px;border-radius:6px;font-size:14px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.card{display:flex;flex-direction:column;gap:12px;padding:14px 16px;background:#FFFFFF;border:1px solid #D5D9DE;border-radius:12px;text-decoration:none;color:#111827}
.card.fault{border-color:#E9A8A8}
.card.muted{background:#EEF0F2;border-color:#C9CED4}
.card.muted .vname{color:#374151}
.card.stale{border-style:dashed;border-color:#9F8BD6}
.vname{font-size:18px;font-weight:700;line-height:24px}
.vsub{font-size:14px;color:#4B5563;line-height:20px}
.mrow{display:flex;align-items:center;gap:16px;font-size:15px}
.m{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.upd{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:13px;color:#4B5563}
.sum{height:52px;border-radius:10px;border:1px solid #D5D9DE;background:#FFFFFF;display:flex;align-items:center;gap:8px;padding:0 10px;cursor:pointer;font:inherit;color:#111827;text-align:left}
.sum.on{border:2px solid #1E293B;padding:0 9px}
.chip{height:48px;border-radius:8px;border:1px solid #8A929C;background:#FFFFFF;display:inline-flex;align-items:center;gap:6px;padding:0 14px;font:inherit;font-size:14px;font-weight:600;color:#1F2937;white-space:nowrap;cursor:pointer;flex:none}
.chip.on{background:#1E293B;border-color:#1E293B;color:#FFFFFF}
.nav{height:80px;background:#FFFFFF;border-top:1px solid #D5D9DE;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.navi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:#4B5563;font-size:13px;font-weight:600}
.navi .pill{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.navi.on{color:#111827}
.navi.on .pill{background:#DDE3EA}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F4F5F2; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <header style="height: 64px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; background: #FFFFFF; border-bottom: 1px solid #D5D9DE">
    <h1 style="margin: 0; font-size: 22px; font-weight: 700; flex: 1">Vehicles</h1>
    <a href="Account.dc.html" class="iconbtn" aria-label="Account: Elif Kaya, Admin" style="text-decoration: none">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #1E293B; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">EK</span>
    </a>
  </header>

  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
    <section aria-label="Status summary" style="padding: 12px 16px 4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{summary}}" as="s" hint-placeholder-count="6">
        <button class="sum {{s.on}}" onClick="{{s.pick}}" aria-label="{{s.aria}}">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: {{s.color}}; width: 20px; height: 20px"><path d="{{s.icon}}"></path></svg>
          <span class="tn" style="font-size: 20px; font-weight: 700">{{s.count}}</span>
          <span style="font-size: 13px; font-weight: 600; color: #374151">{{s.label}}</span>
        </button>
      </sc-for>
    </section>

    <div style="display: flex; gap: 8px; padding: 8px 16px; overflow: hidden">
      <button class="chip" aria-label="Fleet filter: All fleets">All fleets<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <span style="width: 1px; background: #C9CED4; margin: 8px 0; flex: none"></span>
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button class="chip {{c.on}}" onClick="{{c.pick}}">
          <sc-if value="{{c.sel}}" hint-placeholder-val="{{ false }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></sc-if>
          {{c.label}}
        </button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 16px 8px; font-size: 13px; color: #4B5563">
      <span class="tn">{{countLine}}</span>
      <span>Sorted by status</span>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 0 16px 16px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{vehicles}}" as="v" hint-placeholder-count="5">
        <a href="Detail.dc.html" class="card {{v.cls}}" aria-label="{{v.aria}}">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
            <div style="min-width: 0">
              <div class="vname">{{v.name}}</div>
              <div class="vsub">{{v.fleet}}</div>
            </div>
            <span class="badge" style="background: {{v.tint}}; color: {{v.color}}; border-color: {{v.border}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{v.icon}}"></path></svg>{{v.label}}</span>
          </div>
          <sc-if value="{{v.hasData}}" hint-placeholder-val="{{ true }}">
            <div class="mrow">
              <span class="m" style="color: {{v.batColor}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{v.batIcon}}"></path></svg><span class="tn">{{v.bat}}</span></span>
              <span class="m" style="color: {{v.spdColor}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14l4-4M3.34 19a10 10 0 1 1 17.32 0"></path></svg><span class="tn">{{v.spd}}</span></span>
              <span class="upd tn" style="color: {{v.updColor}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 14px; height: 14px"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18M12 7v5l3 2"></path></svg>{{v.upd}}</span>
            </div>
          </sc-if>
          <sc-if value="{{v.noData}}" hint-placeholder-val="{{ false }}">
            <div class="mrow">
              <span class="m" style="color: #4B5563"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18M8 12h8"></path></svg>No data yet</span>
              <span class="upd">Never reported</span>
            </div>
          </sc-if>
        </a>
      </sc-for>
    </div>
  </div>

  <nav class="nav" aria-label="Views">
    <a href="Main.dc.html" class="navi on" aria-current="page"><span class="pill"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></span>List</a>
    <a href="Map.dc.html" class="navi"><span class="pill"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2ZM9 4v14M15 6v14"></path></svg></span>Map</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { filter: 'all' }; }
  renderVals() {
    const I = {
      moving: 'M12 3 19 20 12 16.5 5 20Z',
      idle: 'M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18M10 9v6M14 9v6',
      charging: 'M13 2 4 14h7l-1 8 9-12h-7Z',
      fault: 'M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0ZM12 9v4M12 17h.01',
      offline: 'M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 5.2-2.8M19 12.9a10 10 0 0 0-2.3-1.7M2 8.8a15 15 0 0 1 4.2-2.7M22 8.8A15 15 0 0 0 10.7 5M12 20h.01',
      stale: 'M12 3a9 9 0 1 0 0 18 9 9 0 1 0 0-18M12 7v5l3 2'
    };
    const S = {
      moving: { label: 'Moving', c: '#137333', t: '#E7F6EC' },
      idle: { label: 'Idle', c: '#975400', t: '#FDF3DC' },
      charging: { label: 'Charging', c: '#1D4ED8', t: '#E3ECFD' },
      fault: { label: 'Fault', c: '#B91C1C', t: '#FDE7E7' },
      offline: { label: 'Offline', c: '#4B5563', t: '#ECEEF1' },
      stale: { label: 'Stale', c: '#6D28D9', t: '#EFEAFC' }
    };
    const BAT = 'M4 7h13a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2ZM22 11v2';
    const BATLOW = BAT + 'M6 10v4';
    const raw = [
      ['TR-04', 'Tarsus Field Ops', 'fault', 52, 0, 'updated 8s ago'],
      ['TR-01', 'Tarsus Field Ops', 'moving', 78, 12.4, 'updated 4s ago'],
      ['TR-05', 'Tarsus Field Ops', 'moving', 18, 9.8, 'updated 2s ago'],
      ['AD-01', 'Adana Field Ops', 'moving', 91, 14.1, 'updated 5s ago'],
      ['TR-02', 'Tarsus Field Ops', 'idle', 64, 0, 'updated 6s ago'],
      ['AD-02', 'Adana Field Ops', 'idle', 70, 0, 'updated 3s ago'],
      ['TR-03', 'Tarsus Field Ops', 'charging', 31, 0, 'updated 3s ago'],
      ['TR-06', 'Tarsus Field Ops', 'stale', 44, 7.2, 'last seen 2m ago'],
      ['AD-03', 'Adana Field Ops', 'offline', 23, null, 'last seen 3h ago'],
      ['AD-04', 'Adana Field Ops', 'offline', null, null, ''],
      ['AD-05', 'Adana Field Ops', 'offline', null, null, '']
    ];
    const all = raw.map(([name, fleet, st, bat, spd, upd]) => {
      const s = S[st]; const noData = bat === null; const muted = st === 'offline' || st === 'stale';
      const low = bat !== null && bat < 20 && !muted;
      return {
        name, fleet, st, label: s.label, color: s.c, tint: s.t, icon: I[st],
        border: st === 'stale' ? '#B9A6EA' : 'transparent',
        cls: [st === 'fault' ? 'fault' : '', muted ? 'muted' : '', st === 'stale' ? 'stale' : ''].join(' '),
        hasData: !noData, noData,
        bat: noData ? '' : bat + '%', batIcon: low ? BATLOW : BAT,
        batColor: low ? '#B91C1C' : (muted ? '#4B5563' : '#111827'),
        spd: spd === null ? '— km/h' : spd.toFixed(1) + ' km/h',
        spdColor: muted ? '#4B5563' : '#111827',
        upd, updColor: st === 'stale' ? '#6D28D9' : '#4B5563',
        aria: name + ', ' + fleet + ', ' + s.label + (noData ? ', no data yet' : ', battery ' + bat + '%, ' + upd)
      };
    });
    const f = this.state.filter;
    const keys = ['moving', 'idle', 'charging', 'fault', 'offline', 'stale'];
    const pick = (k) => () => this.setState({ filter: this.state.filter === k ? 'all' : k });
    const summary = keys.map((k) => {
      const n = all.filter((v) => v.st === k).length;
      return { count: n, label: S[k].label, color: S[k].c, icon: I[k], on: f === k ? 'on' : '', pick: pick(k), aria: n + ' ' + S[k].label + ', filter' };
    });
    const chips = [{ k: 'all', label: 'All' }].concat(keys.map((k) => ({ k, label: S[k].label }))).map((c) => ({
      label: c.label, sel: f === c.k, on: f === c.k ? 'on' : '', pick: () => this.setState({ filter: c.k })
    }));
    const vehicles = f === 'all' ? all : all.filter((v) => v.st === f);
    return { summary, chips, vehicles, countLine: vehicles.length + ' of ' + all.length + ' vehicles · 2 fleets' };
  }
}
</script>
</body>
</html>
